services:
  db:
    image: postgres:16
    container_name: ride_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ride_hailing
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: ride_redis
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: ride_app
    depends_on:
      - db
      - redis
    ports:
      - "8080:8080"
    env_file:
      - .env